name: server

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  php-postgresql:
    name: PHP and PostgreSQL
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes php-cli php-curl php-mbstring php-pgsql php-xml postgresql postgresql-client postgresql-16-pgvector
          php --version
          psql --version
          composer --version
      - name: Create disposable test role
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql --set ON_ERROR_STOP=1 --command "CREATE ROLE dwemer LOGIN PASSWORD 'dwemer' CREATEDB;"
      - name: Install focused test dependencies
        working-directory: unittests
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Audit tracked server tree
        shell: pwsh
        run: ./tools/audit-release-tree.ps1
      - name: Verify protocol manifest
        run: |
          for version in v1 v2; do
            (cd "protocol/$version" && sha256sum --check manifest.sha256)
          done
      - name: Run PHPUnit and disposable PostgreSQL checks
        working-directory: unittests
        run: ./vendor/bin/phpunit --colors=always
      - name: Record evidence boundary
        if: always()
        run: |
          printf '%s\n' 'This job proves the tracked source-tree lint/safety audit, protocol hashes, PHPUnit, and disposable PostgreSQL behavior.' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'It builds no release package.' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'It does not claim DwemerDistro deployment, live providers, or Fallout 4 gameplay.' >> "$GITHUB_STEP_SUMMARY"
