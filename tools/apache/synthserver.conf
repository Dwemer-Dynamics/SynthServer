Listen 127.0.0.1:8087

<VirtualHost 127.0.0.1:8087>
    ServerName synthserver.local
    DocumentRoot /var/www/html
    Alias /Synthserver /var/www/html/Synthserver

    <Directory /var/www/html>
        Options -Indexes -ExecCGI +FollowSymLinks
        AllowOverride None
        Require all denied
    </Directory>

    <Directory /var/www/html/Synthserver>
        Options -Indexes -ExecCGI +FollowSymLinks
        AllowOverride FileInfo
        Require local
        DirectoryIndex index.php
    </Directory>

    <Directory /var/www/html/Dwemer-Dashboard>
        Options -Indexes -ExecCGI +FollowSymLinks
        AllowOverride None
        Require local
    </Directory>

    # Voice upload snapshots are internal provider inputs, never downloadable media.
    <Directory /var/www/html/Synthserver/data/tmp/voice_uploads>
        Require all denied
    </Directory>

    # Local copyrighted reference recordings, transcripts and rollback copies are not web assets.
    <Directory /var/www/html/Synthserver/data/voices/catalogs>
        Require all denied
    </Directory>
    <Directory /var/www/html/Synthserver/data/voices/catalog-backups>
        Require all denied
    </Directory>

    # Speech jobs contain frozen provider credentials and are never public assets.
    <Directory /var/www/html/Synthserver/data/tmp/npc_tts_jobs>
        Require all denied
    </Directory>

    LimitRequestBody 33554432
    ErrorLog ${APACHE_LOG_DIR}/synthserver-error.log
    CustomLog ${APACHE_LOG_DIR}/synthserver-access.log combined
</VirtualHost>
